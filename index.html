    <script>
      /* Pre-paint theme stamp. Must agree with src/lib/mode.js: stored
         preference first, else prefers-color-scheme. html[data-mode] feeds
         the generated pre-mount ground in m3-tokens.css and color-scheme. */
      (function () {
        var m = null;
        try { m = localStorage.getItem('site-mode'); } catch (e) {}
        if (m !== 'light' && m !== 'dark') {
          m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.mode = m;
      })();
    </script>
