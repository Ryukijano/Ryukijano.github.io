<!doctype html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/seal.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2ed" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('site-theme'); } catch { saved = null; }
        const theme = saved === 'dark' || saved === 'light'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101b2b' : '#f4f2ed';
      })();
    </script>
<!--head-->
    <title>Gyanateet Dutta</title>
<!--/head-->
<!--preload-->
    <!-- The display face, and only it: preloading all five would put 122 kB
         of font in front of the plate, which is the LCP element. The rest swap. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="/fonts/source-serif-4-upright-var.woff2">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
