<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a237e" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#1a237e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a237e" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="640" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#e6e1d3" font-size="20" font-weight="700" letter-spacing="2">
    WAVE · FIELD · LATTICE
  </text>
  <text x="450" y="56" text-anchor="middle" fill="#e6e1d3" font-size="11" opacity="0.5" letter-spacing="1">
    Design System Map — Ryukijano Portfolio
  </text>

  <!-- ==================== THREE MOTIF COLUMNS ==================== -->

  <!-- WAVE COLUMN (Ryukijano) -->
  <g transform="translate(30, 80)">
    <!-- Column header -->
    <rect x="0" y="0" width="260" height="28" rx="4" fill="#1a237e" opacity="0.15"/>
    <text x="130" y="19" text-anchor="middle" fill="#1a237e" font-size="13" font-weight="600" letter-spacing="1.5">WAVE</text>

    <!-- Visual: sinusoidal waves -->
    <g transform="translate(0, 40)">
      <path d="M 0 40 Q 32 10 65 40 T 130 40 T 195 40 T 260 40" fill="none" stroke="#1a237e" stroke-width="1.5" opacity="0.6"/>
      <path d="M 0 55 Q 32 25 65 55 T 130 55 T 195 55 T 260 55" fill="none" stroke="#1a237e" stroke-width="1.5" opacity="0.4"/>
      <path d="M 0 70 Q 32 40 65 70 T 130 70 T 195 70 T 260 70" fill="none" stroke="#1a237e" stroke-width="1.5" opacity="0.25"/>
    </g>

    <!-- Properties -->
    <g transform="translate(0, 130)" font-size="10" fill="#e6e1d3">
      <text x="0" y="0" opacity="0.4" letter-spacing="0.5">PERSONA</text>
      <text x="0" y="16" fill="#1a237e" font-weight="600">Ryukijano</text>
      <text x="0" y="30" opacity="0.5">Graphics &amp; Systems</text>

      <text x="0" y="54" opacity="0.4" letter-spacing="0.5">COLOR</text>
      <rect x="0" y="62" width="16" height="16" rx="3" fill="#1a237e"/>
      <text x="22" y="74" font-size="9" opacity="0.7">indigo-ink</text>
      <text x="22" y="86" font-size="8" opacity="0.4">#1a237e</text>

      <text x="0" y="108" opacity="0.4" letter-spacing="0.5">TYPE</text>
      <text x="0" y="124" font-family="Georgia, serif" font-size="14" fill="#e6e1d3" font-style="italic">Newsreader</text>
      <text x="0" y="138" font-size="8" opacity="0.4">Serif — editorial voice</text>

      <text x="0" y="160" opacity="0.4" letter-spacing="0.5">MOTION</text>
      <text x="0" y="176" font-size="9" opacity="0.7">Sinusoidal flow</text>
      <text x="0" y="188" font-size="9" opacity="0.7">Amplitude: 60px</text>
      <text x="0" y="200" font-size="9" opacity="0.7">Speed: 0.01/frame</text>
    </g>
  </g>

  <!-- FIELD COLUMN (Gyanateet) -->
  <g transform="translate(320, 80)">
    <rect x="0" y="0" width="260" height="28" rx="4" fill="#6478ff" opacity="0.15"/>
    <text x="130" y="19" text-anchor="middle" fill="#6498ff" font-size="13" font-weight="600" letter-spacing="1.5">FIELD</text>

    <!-- Visual: sparse particle grid -->
    <g transform="translate(0, 40)" filter="url(#glow)">
      <rect x="20" y="10" width="3" height="3" fill="#64dcff" opacity="0.6"/>
      <rect x="60" y="25" width="4" height="4" fill="#7896ff" opacity="0.5"/>
      <rect x="100" y="15" width="3" height="3" fill="#b482ff" opacity="0.4"/>
      <rect x="140" y="35" width="3" height="3" fill="#64dcff" opacity="0.5"/>
      <rect x="180" y="20" width="4" height="4" fill="#8c8cff" opacity="0.6"/>
      <rect x="220" y="30" width="3" height="3" fill="#7896ff" opacity="0.4"/>
      <rect x="40" y="50" width="3" height="3" fill="#b482ff" opacity="0.5"/>
      <rect x="80" y="60" width="4" height="4" fill="#64dcff" opacity="0.7"/>
      <rect x="120" y="55" width="3" height="3" fill="#7896ff" opacity="0.4"/>
      <rect x="160" y="65" width="3" height="3" fill="#8c8cff" opacity="0.5"/>
      <rect x="200" y="50" width="4" height="4" fill="#64dcff" opacity="0.6"/>
      <rect x="30" y="80" width="3" height="3" fill="#7896ff" opacity="0.3"/>
      <rect x="70" y="85" width="3" height="3" fill="#b482ff" opacity="0.4"/>
      <rect x="110" y="80" width="4" height="4" fill="#64dcff" opacity="0.5"/>
      <rect x="150" y="90" width="3" height="3" fill="#8c8cff" opacity="0.4"/>
      <rect x="190" y="85" width="3" height="3" fill="#7896ff" opacity="0.5"/>
    </g>

    <!-- Properties -->
    <g transform="translate(0, 130)" font-size="10" fill="#e6e1d3">
      <text x="0" y="0" opacity="0.4" letter-spacing="0.5">PERSONA</text>
      <text x="0" y="16" fill="#6498ff" font-weight="600">Gyanateet</text>
      <text x="0" y="30" opacity="0.5">AI Researcher</text>

      <text x="0" y="54" opacity="0.4" letter-spacing="0.5">COLOR</text>
      <rect x="0" y="62" width="16" height="16" rx="3" fill="#64dcff"/>
      <text x="22" y="74" font-size="9" opacity="0.7">cyan / blue / purple</text>
      <text x="22" y="86" font-size="8" opacity="0.4">soft glowing palette</text>

      <text x="0" y="108" opacity="0.4" letter-spacing="0.5">TYPE</text>
      <text x="0" y="124" font-family="Inter, sans-serif" font-size="14" fill="#e6e1d3" font-weight="500">Inter Tight</text>
      <text x="0" y="138" font-size="8" opacity="0.4">Sans — technical voice</text>

      <text x="0" y="160" opacity="0.4" letter-spacing="0.5">MOTION</text>
      <text x="0" y="176" font-size="9" opacity="0.7">Noise-field drift</text>
      <text x="0" y="188" font-size="9" opacity="0.7">Density: 0.25</text>
      <text x="0" y="200" font-size="9" opacity="0.7">Speed: 0.015/frame</text>
    </g>
  </g>

  <!-- LATTICE COLUMN (Ryoushi) -->
  <g transform="translate(610, 80)">
    <rect x="0" y="0" width="260" height="28" rx="4" fill="#ff2e63" opacity="0.15"/>
    <text x="130" y="19" text-anchor="middle" fill="#ff2e63" font-size="13" font-weight="600" letter-spacing="1.5">LATTICE</text>

    <!-- Visual: perspective grid -->
    <g transform="translate(0, 40)">
      <g opacity="0.5">
        <line x1="0" y1="90" x2="260" y2="90" stroke="#ff2e63" stroke-width="0.8"/>
        <line x1="20" y1="60" x2="240" y2="60" stroke="#ff2e63" stroke-width="0.6" opacity="0.6"/>
        <line x1="50" y1="35" x2="210" y2="35" stroke="#ff2e63" stroke-width="0.5" opacity="0.4"/>
        <line x1="80" y1="15" x2="180" y2="15" stroke="#ff2e63" stroke-width="0.4" opacity="0.3"/>
        <!-- Vertical lines converging -->
        <line x1="0" y1="90" x2="80" y2="15" stroke="#ff2e63" stroke-width="0.5" opacity="0.4"/>
        <line x1="52" y1="90" x2="110" y2="15" stroke="#ff2e63" stroke-width="0.5" opacity="0.4"/>
        <line x1="104" y1="90" x2="140" y2="15" stroke="#ff2e63" stroke-width="0.5" opacity="0.4"/>
        <line x1="156" y1="90" x2="170" y2="15" stroke="#ff2e63" stroke-width="0.5" opacity="0.4"/>
        <line x1="208" y1="90" x2="200" y2="15" stroke="#ff2e63" stroke-width="0.5" opacity="0.4"/>
        <line x1="260" y1="90" x2="230" y2="15" stroke="#ff2e63" stroke-width="0.5" opacity="0.4"/>
      </g>
      <!-- Floating particles -->
      <circle cx="65" cy="50" r="2" fill="#ff2e63" opacity="0.7"/>
      <circle cx="195" cy="65" r="1.5" fill="#00ffff" opacity="0.6"/>
      <circle cx="130" cy="45" r="1" fill="#ff2e63" opacity="0.5"/>
    </g>

    <!-- Properties -->
    <g transform="translate(0, 130)" font-size="10" fill="#e6e1d3">
      <text x="0" y="0" opacity="0.4" letter-spacing="0.5">PERSONA</text>
      <text x="0" y="16" fill="#ff2e63" font-weight="600">Ryoushi</text>
      <text x="0" y="30" opacity="0.5">Quantum Researcher</text>

      <text x="0" y="54" opacity="0.4" letter-spacing="0.5">COLOR</text>
      <rect x="0" y="62" width="16" height="16" rx="3" fill="#ff2e63"/>
      <text x="22" y="74" font-size="9" opacity="0.7">magenta</text>
      <text x="22" y="86" font-size="8" opacity="0.4">#ff2e63</text>

      <text x="0" y="108" opacity="0.4" letter-spacing="0.5">TYPE</text>
      <text x="0" y="124" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e6e1d3">JetBrains Mono</text>
      <text x="0" y="138" font-size="8" opacity="0.4">Mono — systems voice</text>

      <text x="0" y="160" opacity="0.4" letter-spacing="0.5">MOTION</text>
      <text x="0" y="176" font-size="9" opacity="0.7">Grid-snap vibration</text>
      <text x="0" y="188" font-size="9" opacity="0.7">Amplitude: 3px</text>
      <text x="0" y="200" font-size="9" opacity="0.7">Speed: 0.008/frame</text>
    </g>
  </g>

  <!-- ==================== SHARED TOKENS BAR ==================== -->
  <g transform="translate(30, 360)">
    <line x1="0" y1="0" x2="840" y2="0" stroke="#e6e1d3" stroke-width="0.5" opacity="0.15"/>
    <text x="0" y="20" fill="#e6e1d3" font-size="11" font-weight="600" letter-spacing="1" opacity="0.6">SHARED TOKENS</text>

    <!-- Color tokens -->
    <g transform="translate(0, 36)">
      <text x="0" y="0" fill="#e6e1d3" font-size="9" opacity="0.4" letter-spacing="0.5">COLORS</text>
      <g transform="translate(0, 12)">
        <rect x="0" y="0" width="24" height="24" rx="4" fill="#1a237e"/>
        <text x="30" y="11" fill="#e6e1d3" font-size="9" opacity="0.7">indigo-ink</text>
        <text x="30" y="22" fill="#e6e1d3" font-size="8" opacity="0.4">#1a237e</text>
      </g>
      <g transform="translate(120, 12)">
        <rect x="0" y="0" width="24" height="24" rx="4" fill="#ff2e63"/>
        <text x="30" y="11" fill="#e6e1d3" font-size="9" opacity="0.7">magenta</text>
        <text x="30" y="22" fill="#e6e1d3" font-size="8" opacity="0.4">#ff2e63</text>
      </g>
      <g transform="translate(240, 12)">
        <rect x="0" y="0" width="24" height="24" rx="4" fill="#e6e1d3"/>
        <text x="30" y="11" fill="#e6e1d3" font-size="9" opacity="0.7">washi</text>
        <text x="30" y="22" fill="#e6e1d3" font-size="8" opacity="0.4">#e6e1d3</text>
      </g>
      <g transform="translate(360, 12)">
        <rect x="0" y="0" width="24" height="24" rx="4" fill="#00ffff"/>
        <text x="30" y="11" fill="#e6e1d3" font-size="9" opacity="0.7">cyan</text>
        <text x="30" y="22" fill="#e6e1d3" font-size="8" opacity="0.4">#00ffff</text>
      </g>
    </g>

    <!-- Motion tokens -->
    <g transform="translate(500, 36)">
      <text x="0" y="0" fill="#e6e1d3" font-size="9" opacity="0.4" letter-spacing="0.5">MOTION</text>
      <g transform="translate(0, 12)" font-size="9" fill="#e6e1d3" opacity="0.6">
        <text x="0" y="11">ease-slow: cubic-bezier(0.25, 1, 0.5, 1)</text>
        <text x="0" y="26">dur-expand: 700ms</text>
        <text x="0" y="41">dur-fade: 300ms</text>
      </g>
    </g>
  </g>

  <!-- ==================== MOTIF ENGINE FLOW ==================== -->
  <g transform="translate(30, 470)">
    <line x1="0" y1="0" x2="840" y2="0" stroke="#e6e1d3" stroke-width="0.5" opacity="0.15"/>
    <text x="0" y="20" fill="#e6e1d3" font-size="11" font-weight="600" letter-spacing="1" opacity="0.6">MOTIF ENGINE — UNIFIED PARTICLE SYSTEM</text>

    <!-- Flow diagram -->
    <g transform="translate(0, 40)">
      <!-- Wave node -->
      <rect x="0" y="0" width="100" height="36" rx="6" fill="#1a237e" opacity="0.2" stroke="#1a237e" stroke-width="1" stroke-opacity="0.5"/>
      <text x="50" y="23" text-anchor="middle" fill="#1a237e" font-size="11" font-weight="600">Wave</text>

      <!-- Arrow -->
      <path d="M 105 18 L 135 18" stroke="#e6e1d3" stroke-width="1" opacity="0.3" marker-end="url(#arrow)"/>
      <text x="120" y="12" text-anchor="middle" fill="#e6e1d3" font-size="7" opacity="0.4">lerp</text>

      <!-- Field node -->
      <rect x="140" y="0" width="100" height="36" rx="6" fill="#6478ff" opacity="0.2" stroke="#6498ff" stroke-width="1" stroke-opacity="0.5"/>
      <text x="190" y="23" text-anchor="middle" fill="#6498ff" font-size="11" font-weight="600">Field</text>

      <!-- Arrow -->
      <path d="M 245 18 L 275 18" stroke="#e6e1d3" stroke-width="1" opacity="0.3"/>
      <text x="260" y="12" text-anchor="middle" fill="#e6e1d3" font-size="7" opacity="0.4">lerp</text>

      <!-- Lattice node -->
      <rect x="280" y="0" width="100" height="36" rx="6" fill="#ff2e63" opacity="0.2" stroke="#ff2e63" stroke-width="1" stroke-opacity="0.5"/>
      <text x="330" y="23" text-anchor="middle" fill="#ff2e63" font-size="11" font-weight="600">Lattice</text>

      <!-- Engine description -->
      <g transform="translate(420, 0)" font-size="9" fill="#e6e1d3" opacity="0.5">
        <text x="0" y="6">One canvas · one particle grid</text>
        <text x="0" y="20">Mode drives: colors, amplitude,</text>
        <text x="0" y="34">density, glow, grid-snap, line mode</text>
      </g>
    </g>
  </g>

  <!-- ==================== ARCHITECTURE ==================== -->
  <g transform="translate(30, 560)">
    <line x1="0" y1="0" x2="840" y2="0" stroke="#e6e1d3" stroke-width="0.5" opacity="0.15"/>
    <text x="0" y="20" fill="#e6e1d3" font-size="11" font-weight="600" letter-spacing="1" opacity="0.6">ARCHITECTURE</text>

    <g transform="translate(0, 36)" font-size="9" fill="#e6e1d3" opacity="0.5" font-family="'JetBrains Mono', monospace">
      <text x="0" y="0">src/App.jsx</text>
      <text x="120" y="0" opacity="0.3">→</text>
      <text x="140" y="0">Portfolio orchestrator (155 lines)</text>
      <text x="0" y="16">src/data/portfolio.js</text>
      <text x="120" y="16" opacity="0.3">→</text>
      <text x="140" y="16">Persona + project content data</text>
      <text x="0" y="32">src/components/MotifEngine.jsx</text>
      <text x="200" y="32" opacity="0.3">→</text>
      <text x="220" y="32">Unified Wave·Field·Lattice particle system</text>
    </g>
  </g>

  <!-- Arrow marker def -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6" fill="none" stroke="#e6e1d3" stroke-width="1" opacity="0.3"/>
    </marker>
  </defs>
</svg>
